spring.application.name=pavilion-api
server.port=${PORT:8081}

spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:./data/pavilion.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me}

app.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:5173}

recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
