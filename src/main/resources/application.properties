spring.application.name=pavilion-api
server.port=${PORT:8081}

# Defaults to the bundled SQLite file. Set DB_URL/DB_DRIVER/DB_DIALECT (and
# DB_USERNAME/DB_PASSWORD if needed) to point at MySQL instead — see the
# README's "Using MySQL locally (XAMPP)" section.
spring.datasource.url=${DB_URL:jdbc:sqlite:${DATABASE_PATH:./data/pavilion.db}}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
# Flyway (below) now owns the schema, so Hibernate shouldn't alter it — ddl-auto is deliberately
# "none" rather than "validate": hibernate-community-dialects' SQLiteDialect generates "integer"
# for identity/PK columns (SQLite requires exactly that type for its rowid-alias autoincrement to
# kick in) but its schema *validator* independently expects "bigint" for any Long-mapped column,
# so validate mode fails on a correctly-declared SQLite schema even though nothing is wrong.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Vendor-specific migration SQL under db/migration/{sqlite,mysql} — {vendor} resolves from the
# JDBC connection Flyway sees, so the same config works for both without an env var of its own.
spring.flyway.locations=classpath:db/migration/{vendor}
# Lets Flyway adopt a database that already has these tables (e.g. a local dev DB created before
# migrations existed, back when ddl-auto=update managed the schema) by treating V1 as already
# applied there instead of trying to re-run its CREATE TABLEs — see the README's "Database
# migrations" section before changing this.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me}

app.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:5173}

recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:}

gemini.api-key=${GEMINI_API_KEY:}

# Paid amenity bookings (tennis court, party hall) go through Stripe Checkout. Free amenities
# (clubhouse, pool) work regardless of whether this is set — see StripeService.
stripe.secret-key=${STRIPE_SECRET_KEY:}
# Falls back to this when a booking request has no Origin header (e.g. a non-browser client),
# matching the Node original's fallback chain for building the Checkout success/cancel URLs.
app.public-url=${PUBLIC_APP_URL:http://localhost:5173}

# Per-file cap matches FileStorageService's own 8MB check; max-request-size covers up to
# 6 photos per maintenance request plus form overhead.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# Actuator: only expose health/info over HTTP (not env, beans, etc., which
# can leak configuration) — see SecurityConfig for the matching permitAll rule.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
