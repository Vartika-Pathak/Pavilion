spring.application.name=pavilion-api
server.port=${PORT:8081}

# Defaults to the bundled SQLite file. Set DB_URL/DB_DRIVER/DB_DIALECT (and
# DB_USERNAME/DB_PASSWORD if needed) to point at MySQL instead — see the
# README's "Using MySQL locally (XAMPP)" section.
spring.datasource.url=${DB_URL:jdbc:sqlite:${DATABASE_PATH:./data/pavilion.db}}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me}

app.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:5173}

recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

mailersend.api-key=${MAILERSEND_API_KEY:}
mail.from=${MAIL_FROM:}

gemini.api-key=${GEMINI_API_KEY:}
