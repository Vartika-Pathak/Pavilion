# In-memory SQLite, one shared connection (SQLite's :memory: db lives only as long as the
# connection that opened it, so the pool has to be pinned to a single, reused connection).
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false

# Tests get a throwaway in-memory schema straight from the entities — no need to also exercise
# Flyway here (that happens for real every time the app itself starts, migrations included).
spring.flyway.enabled=false

jwt.secret=test-only-jwt-secret-not-used-anywhere-real
app.cors.allowed-origins=http://localhost:5173

# Left unset here on purpose: RecaptchaService/ChatService are @MockBean'd in the tests that
# need controllable behavior. EmailService silently no-ops when unconfigured, which is what
# every test wants (no real network calls).
recaptcha.secret-key=
brevo.api-key=
mail.from=
gemini.api-key=

management.endpoints.web.exposure.include=health,info
